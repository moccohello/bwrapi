[package]
name = "bwrapi-game"
version = "1.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "bwrapi_game"
crate-type = ["rlib"]

[dependencies]
bwrapi-layout = { path = "../layout" }
bwrapi-memory = { path = "../memory" }
bwrapi-engine = { path = "../engine" }

[dev-dependencies]
bwrapi-engine = { path = "../engine", features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
